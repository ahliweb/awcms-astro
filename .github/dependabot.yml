version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Update patch/minor digabung agar tidak membanjiri antrean review.
    # Major dipisah karena butuh pembacaan upgrade guide dan ADR bila
    # menyentuh stack (lihat ADR-0010).
    groups:
      minor-dan-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
