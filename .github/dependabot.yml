version: 2
updates:
  # Ekosistem `bun` sejak ADR-0015 (repo ini tidak lagi punya package-lock.json).
  # Pola yang sama sudah dipakai `ahliweb/awcms`.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Update patch/minor digabung agar tidak membanjiri antrean review.
    # Major dipisah karena butuh pembacaan upgrade guide dan ADR bila
    # menyentuh stack (lihat ADR-0010).
    groups:
      minor-dan-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # TypeScript 7 belum didukung `@astrojs/check@0.9.10` — rilis TERBARU per
      # 2026-07-28 — yang menyatakan
      # `peerDependencies: { typescript: "^5.0.0 || ^6.0.0" }`.
      #
      # Catatan setelah pindah ke Bun (ADR-0015): `bun install` TIDAK menolak
      # peer mismatch seperti npm (ERESOLVE) — ia hanya memperingatkan lalu
      # memasangnya. Entri ini karena itu justru LEBIH penting sekarang: tanpa
      # ia, bump TypeScript 7 akan terpasang mulus dan gagal belakangan di
      # `astro check` — kegagalan yang jauh dari sebabnya.
      #
      # Rentangnya sengaja `>=7`, bukan "major": TypeScript 6 MASIH di dalam
      # peer range, jadi bump ke 6 tetap boleh lewat.
      #
      # HAPUS entri ini begitu @astrojs/check melebarkan peer range-nya.
      # Periksa dengan: bunx npm view @astrojs/check peerDependencies
      - dependency-name: typescript
        versions: [">=7"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
