name: Laporan bug
description: Template error, hasil build salah, tampilan rusak, atau tautan mati
labels: ["bug"]
body:
  - type: input
    id: halaman
    attributes:
      label: Rute atau berkas
      description: Rute yang bermasalah pada situs hasil build, atau berkas di repo ini.
      placeholder: /en/panduan/<slug>/ — atau src/lib/content.ts
    validations:
      required: true

  - type: textarea
    id: gejala
    attributes:
      label: Apa yang terjadi
    validations:
      required: true

  - type: textarea
    id: harapan
    attributes:
      label: Apa yang seharusnya terjadi
    validations:
      required: true

  - type: input
    id: lingkungan
    attributes:
      label: Browser dan perangkat
      placeholder: Chrome Android 14 / Firefox desktop
    validations:
      required: false

  - type: dropdown
    id: lebar
    attributes:
      label: Lebar layar
      options:
        - Ponsel (di bawah 480px)
        - Tablet (480-1024px)
        - Desktop (di atas 1024px)
        - Tidak yakin
