name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Menahan run lama saat push baru datang ke branch yang sama.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# ---------------------------------------------------------------------------
# Action dipin ke SHA COMMIT, bukan ke tag (ADR-0028 celah 6; SSDF PS.2,
# OpenSSF Scorecard `Pinned-Dependencies`).
#
# Sebuah tag bisa dipindahkan. `actions/checkout@v7` hari ini dan
# `actions/checkout@v7` bulan depan boleh menunjuk kode yang berbeda tanpa satu
# pun berkas di repo ini berubah — dan action berjalan dengan akses ke token
# workflow serta ke seluruh isi checkout. SHA tidak bisa dipindahkan.
#
# Komentar `# vX.Y.Z` di belakang tiap SHA bukan hiasan: Dependabot membacanya
# untuk menaikkan pin sekaligus komentarnya, sehingga baris ini tetap bisa
# dibaca manusia tanpa berhenti bisa diperbarui mesin.
# ---------------------------------------------------------------------------

jobs:
  # ---------------------------------------------------------------------------
  # Selalu jalan. Tidak butuh backend apa pun.
  #
  # `astro check` menjalankan typecheck penuh plus diagnostik template — ia
  # menangkap komponen yang merujuk prop yang tidak ada, impor yang putus, dan
  # tipe adapter yang menyimpang dari kontraknya. Itu adalah sebagian besar
  # cara template ini bisa rusak, dan tidak satu pun darinya butuh konten.
  # ---------------------------------------------------------------------------
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Versi Bun dipin eksplisit dan harus sama dengan `packageManager` di
      # package.json serta tag image di Dockerfile — tiga tempat yang wajib
      # bergerak bersama (ADR-0015).
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Cache Bun install cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      # Sebelum install, bukan sesudah. Gerbang ini murni pembacaan berkas, jadi
      # kegagalannya terbaca sebagai "lockfile menyimpang" — bukan sebagai
      # kegagalan install atau typecheck di langkah yang tidak ada hubungannya.
      # `bun install --frozen-lockfile` di bawah adalah lapis kedua: ia menolak
      # bun.lock yang tidak cocok dengan package.json.
      - name: Lockfile sinkron dengan package.json
        run: bun run check:lockfile

      - name: Pasang dependency
        run: bun install --frozen-lockfile

      - name: Astro check
        run: bun run check

      # Runs in `check`, not `build`: these are pure unit tests over the block
      # renderer and need no content source at all. Putting them behind the
      # conditional build would mean the template repo — the one place this code
      # is actually reviewed — never runs them.
      - name: Unit tests
        run: bun test

      # Tanpa `dist/`, yang jalan di sini hanya gerbang gambar — rasio, format
      # dibaca dari isi berkas, XML SVG. Gerbang keluaran (SEO, hreflang, aset
      # yang dijanjikan, tautan mati, sitemap, nama key bocor) DILEWATI dan
      # skripnya mengatakannya di keluarannya. Ia dijalankan lagi setelah build
      # di job berikutnya, di mana keenamnya benar-benar punya sesuatu untuk
      # diperiksa.
      - name: Audit konten (sumber gambar)
        run: bun run audit:konten

      # Di sini, bukan di job `build`, dan bukan pula di image produksi: yang
      # diperiksanya berkas repo ini sendiri — tanpa build, tanpa jaringan,
      # tanpa awcms. Ia lahir dari indeks ADR yang mendaftarkan enam keputusan
      # yang tak pernah ada di repo ini dan bertahan sembilan ADR tanpa satu pun
      # gerbang berbunyi, karena `audit:konten` hanya membaca `dist/client/**`
      # dan markdown tidak pernah ikut dibangun.
      - name: Audit dokumen (tautan mati, indeks ADR)
        run: bun run audit:dokumen

      # Tetangga `audit:dokumen` dan bukan bagian darinya: yang satu bertanya
      # apakah sebuah dokumen KONSISTEN, yang ini bertanya apakah cerminnya
      # SEUSIA sumber Inggrisnya dan dokumen mana yang belum punya cermin sama
      # sekali (ADR-0039). Menggabungkannya akan menghasilkan gerbang yang hijau
      # sementara sebagian besar korpus belum diterjemahkan — sebuah dokumen
      # tanpa cermin tidak punya pasangan untuk menjadi basi.
      - name: Audit terjemahan (cermin basi, cakupan cermin)
        run: bun run audit:translation

      # Di sini karena ia hanya membaca artefak yang sudah ada di repo: tanpa
      # build, tanpa jaringan, tanpa awcms, dan tanpa graphify terpasang. Ia
      # lahir dari 60 dari 101 label komunitas yang menempel pada komunitas yang
      # salah di dalam `graph.json` — JSON yang sah, di sebelah laporan yang
      # rapi, dengan setiap gerbang lain hijau karena tidak satu pun dari mereka
      # membaca `graphify-out/`.
      - name: Audit graf (artefak graphify, nama komunitas)
        run: bun run audit:graf

      # Satu-satunya gerbang di repo ini yang MELIHAT KE LUAR. Dua dari tiga
      # pemeriksaannya murni membaca berkas; yang ketiga mengambil daftar
      # `docs/adr/` milik `ahliweb/awcms` lewat API GitHub dan memerah bila ada
      # keputusan di sana yang tidak punya vonis di sini.
      #
      # Ia lahir dari dua belas ADR — 0100 sampai 0116, sembilan hari — yang
      # hanyut tanpa terserap sementara `audit:dokumen` hijau sepanjang waktu:
      # gerbang itu memeriksa apakah kutipan RESOLVE, dan tidak ada yang bisa
      # menanyakan kebalikannya. Dua yang terlewat menyebut repo ini secara
      # langsung.
      #
      # Pemeriksaan ketiga DILEWATI dan mengatakannya bila jaringan tidak ada —
      # gerbang yang memerah karena GitHub mati akan dimatikan orang dalam
      # sepekan, dan yang menghijau diam-diam berbohong ke arah yang nyaman.
      - name: Audit serapan (ADR awcms yang belum dibaca siapa pun)
        run: bun run audit:serapan

      # Di sini, BUKAN di belakang `vars.AWCMS_API_URL`, dan itu keputusan.
      #
      # Anggaran aset adalah properti sumber repo ini sendiri, dan menaruhnya di
      # belakang build bersyarat berarti repo template — satu-satunya tempat kode
      # klien ini benar-benar ditinjau — tidak pernah menjalankannya. Alasan yang
      # sama dipakai `bun test` beberapa langkah di atas.
      #
      # Lapis keluarannya melewati dirinya sendiri saat `dist/client` tidak ada,
      # dan MENGATAKANNYA; ia dijalankan lagi di job `build` untuk sebuah situs,
      # tempat angka yang sebenarnya ada.
      - name: Audit aset (anggaran byte pembaca)
        run: bun run audit:aset

      # Membaca nama berkas di `.changesets/` dan tidak lebih: tanpa build,
      # tanpa jaringan, tanpa awcms.
      #
      # Ia lahir dari tiga puluh changeset yang menunggu dua puluh hari di
      # belakang `v0.2.0` — sembilan di antaranya kemampuan yang dilihat
      # pembaca, dua di antaranya perbaikan keamanan yang tidak punya versi
      # bertag untuk ditarik operator situs — dengan setiap gerbang di repo ini
      # hijau sepanjang waktu, karena tidak satu pun membaca `.changesets/`
      # untuk apa pun selain tautan mati (ADR-0048).
      #
      # Batas usianya bisa memerahkan run yang tidak disebabkan siapa pun, dan
      # itu diterima di sini justru karena merahnya tidak menuntut apa-apa dari
      # yang melihatnya: `main` tidak punya check wajib, jadi ia memberi tahu
      # tanpa menghalangi merge, dan yang membersihkannya satu perintah.
      - name: Audit rilis (backlog changeset yang menunggu)
        run: bun run audit:rilis

      # `bun audit` (dependency) dan `bun run audit:konten` adalah dua hal yang
      # berbeda dan namanya sengaja tidak dibuat mirip.
      - name: Audit dependency
        run: bun audit --audit-level=low

  # ---------------------------------------------------------------------------
  # Build penuh — hanya jalan bila repo ini benar-benar punya sumber konten.
  #
  # ## Kenapa dikondisikan, dan kenapa BUKAN dengan memberi build sebuah
  # ## backend tiruan
  #
  # `bun run build` menarik konten dari awcms sungguhan. Repo template ini
  # sendiri tidak punya instans awcms — ia adalah cetakan, bukan situs. Ada tiga
  # pilihan dan dua di antaranya salah:
  #
  #   1. Jalankan build tanpa variabel apa pun. `main` merah selamanya, dan
  #      merah permanen berhenti dibaca orang — persis saat ia akhirnya berarti
  #      sesuatu.
  #   2. Beri build sebuah awcms tiruan supaya selalu hijau. Ini yang paling
  #      menggoda dan paling berbahaya: gerbangnya lulus tanpa pernah
  #      membuktikan template ini bisa bicara dengan sumber kontennya, sehingga
  #      kerusakan integrasi baru ditemukan di produksi.
  #   3. Nyatakan syaratnya secara eksplisit: build jalan kalau — dan hanya
  #      kalau — `vars.AWCMS_API_URL` diisi. Sebuah SITUS yang dibangun dari
  #      template ini selalu mengisinya, jadi di sana gerbang ini selalu jalan.
  #
  # Pilihan 3 yang dipakai. `report` di bawah membuat kondisinya terlihat di
  # ringkasan run, supaya "build tidak jalan" tidak pernah menyamar sebagai
  # "build lulus".
  # ---------------------------------------------------------------------------
  build:
    name: Build
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Cache Bun install cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Pasang dependency
        run: bun install --frozen-lockfile

      - name: Laporkan apakah sumber konten dikonfigurasi
        run: |
          if [ -n "${{ vars.AWCMS_API_URL }}" ]; then
            echo "AWCMS_API_URL terisi — build penuh dijalankan." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "AWCMS_API_URL KOSONG — build penuh DILEWATI." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Ini normal untuk repo template itu sendiri. Untuk sebuah situs, isi repository variables SITE_URL, AWCMS_API_URL, AWCMS_TENANT_ID dan secret AWCMS_API_TOKEN — tanpa itu integrasi ke awcms tidak pernah teruji di CI." >> "$GITHUB_STEP_SUMMARY"
          fi

      # `AWCMS_TENANT_ID` diteruskan, `AWCMS_TENANT_CODE` dan
      # `AWCMS_DEFAULT_TENANT_CODE` TIDAK — dan pertukaran itu bukan kerapian.
      #
      # Sejak ADR-0018 tenant datang dari token, dan kedua variabel lama
      # **ditolak** alih-alih diabaikan (`refuseRetiredVariables` di
      # `src/lib/awcms/tenant.ts`). Selama keduanya masih diteruskan dari sini,
      # sebuah situs yang menyimpan `vars.AWCMS_TENANT_CODE` — nilai yang
      # dokumentasi versi sebelumnya justru menyuruh mengisinya — mendapat build
      # yang gagal di CI dengan sebab yang tidak disebut langkah ini sama sekali.
      #
      # Arah sebaliknya sama pentingnya: `AWCMS_TENANT_ID` adalah assertion yang
      # menangkap token tenant lain terpasang di situs ini, dan tanpa baris di
      # bawah assertion itu tidak pernah berjalan di CI — satu-satunya tempat
      # sebuah situs membangun sebelum deploy.
      - name: Build
        if: vars.AWCMS_API_URL != ''
        run: bun run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          SITE_NAME: ${{ vars.SITE_NAME }}
          SITE_DESCRIPTION: ${{ vars.SITE_DESCRIPTION }}
          SITE_MARK: ${{ vars.SITE_MARK }}
          SITE_SOCIAL_IMAGE: ${{ vars.SITE_SOCIAL_IMAGE }}
          SITE_LOCALES: ${{ vars.SITE_LOCALES }}
          AWCMS_API_URL: ${{ vars.AWCMS_API_URL }}
          AWCMS_TENANT_ID: ${{ vars.AWCMS_TENANT_ID }}
          AWCMS_API_TOKEN: ${{ secrets.AWCMS_API_TOKEN }}

      # Dijalankan LAGI di sini, setelah build, dan bukan karena lupa: lapis
      # integrasi `tests/penyaji.test.mjs` menjalankan artefak produksi
      # sungguhan terhadap `dist/`, dan di job `check` di atas `dist/` tidak
      # pernah ada. Untuk repo template ini langkah ini tidak jalan sama sekali
      # (tidak ada sumber konten); untuk sebuah SITUS inilah satu-satunya tempat
      # di CI yang membuktikan header dan aturan cache pada hasil build.
      - name: Gerbang penyajian atas hasil build
        if: vars.AWCMS_API_URL != ''
        run: bun test

      # Di sini gerbang keluaran benar-benar punya `dist/client` untuk dibaca.
      # Enam kelas cacat yang diperiksanya sama-sama tidak menggagalkan build:
      # halaman tanpa judul, hreflang pincang, `og:image` yang menunjuk 404,
      # tautan mati, sitemap yang mendaftarkan halaman yang tidak dibangun, dan
      # nama key mentah yang tampil sebagai teks kepada pembaca.
      - name: Audit konten atas hasil build
        if: vars.AWCMS_API_URL != ''
        run: bun run audit:konten

      # Dijalankan LAGI di sini karena lapis keluarannya baru punya sesuatu
      # untuk dibaca: `dist/client` ada, jadi yang diukur adalah byte yang
      # benar-benar ditarik satu halaman, bukan batas atas dari sumbernya.
      - name: Audit aset atas hasil build
        if: vars.AWCMS_API_URL != ''
        run: bun run audit:aset

      # Celah 8 ADR-0028 ditutup di sini (ADR-0032): Core Web Vitals diukur
      # LAB atas hasil build — pengukuran lapangan (RUM) tetap DITOLAK karena
      # mengumpulkan data pembaca, dan keterbatasannya dinyatakan: lab mengukur
      # halaman, bukan pembaca, dan INP tidak terukur di lab sehingga Total
      # Blocking Time 200 ms dipakai sebagai proksi — disebut sebagai proksi.
      #
      # Ambang di lighthouserc.json disamakan dengan target dokumen standar
      # (LCP <= 2500 ms, CLS <= 0.1) dan dijaga tests/cwv-lab.test.mjs supaya
      # angka di konfigurasi dan angka di dokumen tidak bisa hanyut terpisah.
      # Yang diaudit SAMPEL — hingga 10 URL kedalaman 4, batas yang DIPILIH di
      # lighthouserc.json; bawaan lhci berhenti diam-diam di 5 URL terdangkal
      # dan tidak pernah mencapai halaman artikel berlokal (kedalaman 3).
      # Seperti dua gerbang di atasnya: hanya berjalan bila situs punya sumber
      # konten — di repo template langkah ini tidak berjalan, dan ringkasan run
      # job ini sudah mengatakannya sejak langkah pertama.
      - name: Core Web Vitals (lab) atas hasil build
        if: vars.AWCMS_API_URL != ''
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12.6.2
        with:
          configPath: lighthouserc.json
          uploadArtifacts: true

      - name: Simpan hasil build
        if: vars.AWCMS_API_URL != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/client
          retention-days: 7
