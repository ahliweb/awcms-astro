# Konfigurasi nginx untuk keluaran statis awcms-astro.
#
# Astro membangun dengan `build.format: 'directory'` (baku), jadi setiap rute
# menjadi `<rute>/index.html`. `try_files` di bawah yang membuat `/sim/` bekerja
# tanpa pengunjung perlu mengetik `index.html`.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Berlaku untuk respons yang locationnya TIDAK punya `add_header` sendiri.
    # Yang punya wajib meng-include ulang snippet ini — alasannya ada di dalam
    # berkasnya.
    include /etc/nginx/snippets/header-keamanan.conf;

    # Traefik/Coolify sudah menangani TLS di depan; kompresi tetap dilakukan di
    # sini karena ia yang tahu tipe berkasnya.
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;

    # Aset ber-hash dari Astro. Namanya berubah setiap kali isinya berubah, jadi
    # ia aman di-cache selamanya — dan itu satu-satunya cara rebuild tidak
    # memaksa pembaca mengunduh ulang seluruh CSS.
    #
    # Satu `add_header`, bukan `expires` + `add_header`. Keduanya sama-sama
    # menulis `Cache-Control`, dan hasilnya dua header `Cache-Control` pada satu
    # respons — cache perantara boleh memilih yang mana saja.
    location /_astro/ {
        include /etc/nginx/snippets/header-keamanan.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # HTML TIDAK boleh di-cache lama. Seluruh premis rebuild lewat webhook
    # adalah konten baru tayang cepat; cache HTML satu jam membatalkannya tanpa
    # ada yang menyadarinya — situs terlihat "belum ter-rebuild" padahal
    # rebuild-nya sudah sukses.
    location / {
        include /etc/nginx/snippets/header-keamanan.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        try_files $uri $uri/ $uri/index.html =404;
    }

    # `src/pages/404.astro` menghasilkan berkas ini. Halaman 404 per-locale juga
    # dibangun (`/en/404/`), tetapi nginx tidak bisa memilihnya tanpa memetakan
    # setiap prefix locale — halaman 404 locale default dipakai untuk semua.
    error_page 404 /404.html;
    location = /404.html {
        include /etc/nginx/snippets/header-keamanan.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        internal;
    }

    # robots.txt dan sitemap dibangkitkan Astro; keduanya dilayani sebagai
    # berkas biasa oleh blok `location /` di atas. Tidak ada aturan khusus yang
    # perlu ditulis, dan menuliskannya justru berisiko menyimpang darinya.

    # Berkas tersembunyi tidak pernah menjadi bagian keluaran build, tapi larangan
    # ini murah dan menutup kelas kesalahan menyalin berkas ke dalam image.
    location ~ /\. {
        deny all;
    }
}
