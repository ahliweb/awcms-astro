# Header keamanan, dipisah sebagai snippet KARENA perilaku `add_header` nginx.
#
# `add_header` tidak menumpuk lintas level: begitu sebuah `location` punya
# `add_header` sendiri, SELURUH `add_header` dari blok `server` dibuang untuk
# respons itu. Menuliskan header ini sekali di `server` lalu menambahkan
# `Cache-Control` di dalam `location` menghasilkan halaman tanpa satu pun header
# keamanan — dan tidak ada yang gagal, tidak ada peringatan, halamannya tetap
# tampil normal. Itu ditemukan oleh pengujian, bukan oleh membaca konfigurasi.
#
# Karena itu snippet ini di-include ULANG di setiap `location` yang punya
# `add_header` sendiri. Duplikasi yang disengaja, dan lebih murah daripada
# header yang hilang diam-diam.

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
